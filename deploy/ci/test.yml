# ETP CI Pipeline — GitHub Actions
#
#
# Jobs:
#   1. python-tests: Full pytest suite
#   2. solidity-tests: Forge test suite
#   3. dst-gate: Deterministic Simulation Testing regression gate
#      - No image tagged :production until DST exits 0

name: ETP CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short

  solidity-tests:
    name: Solidity Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Run Forge tests
        working-directory: contracts
        run: forge test -vvv

  dst-gate:
    name: DST Regression Gate
    runs-on: ubuntu-latest
    needs: [python-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run DST harness
        run: python -m src.simulator.ci_harness --seeds 42,123,777 --steps 500 --fault-rate 0.1
