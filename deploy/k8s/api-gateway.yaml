# ETP API Gateway — Deployment (stateless, 3 replicas)
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: etp
  labels:
    app: etp
    component: api-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: etp
      component: api-gateway
  template:
    metadata:
      labels:
        app: etp
        component: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: etp/node:latest
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: ETP_REQUIRE_REAL_CRYPTO
              value: "1"
            - name: ETP_SERVICE
              value: "api-gateway"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: etp
  labels:
    app: etp
    component: api-gateway
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  selector:
    app: etp
    component: api-gateway
