name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit (ruff + solhint + hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"

      - name: Install pre-commit
        run: pip install "pre-commit>=4.0,<5"

      - name: Cache pre-commit environments
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  semgrep:
    name: semgrep (.semgrep/ crypto + key-handling rules)
    runs-on: ubuntu-latest
    # Non-blocking while the existing-findings backlog is triaged: the
    # rules in .semgrep/ predate their CI wiring and the tree carries a
    # known baseline (2026-08-15: 38 ERROR / 34 WARNING findings — see
    # FedRAMP control RA-5 in docs/compliance/fedramp-high/). Surfacing
    # them as a yellow check makes the backlog visible on every PR
    # without gating merge on pre-existing findings. To make blocking,
    # drop `continue-on-error` once the ERROR count reaches zero.
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install semgrep
        run: pip install "semgrep>=1.90,<2"

      - name: Run project semgrep rules
        run: semgrep scan --config .semgrep/ --metrics=off --error src/ scripts/
