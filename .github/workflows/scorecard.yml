name: Scorecard

# OpenSSF Scorecard — automated supply-chain security posture checks
# (branch protection, pinned dependencies, dangerous workflow patterns,
# token permissions, etc.). Results are uploaded as SARIF to the GitHub
# Security tab (code scanning alerts).
#
# publish_results is set to false: we do NOT publish to the public
# OpenSSF API and we do NOT display a Scorecard badge. Results stay
# internal to the Security tab.
#
# NOTE: GitHub Actions billing is currently blocked for this org, so this
# workflow will not execute until billing is restored. It is committed
# SHA-pinned and ready so it runs unchanged once enabled.

on:
  schedule:
    - cron: "27 6 * * 1"   # weekly, Mondays 06:27 UTC
  push:
    branches: [main]       # default branch
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to the Security tab
      id-token: write          # OIDC for the Scorecard publish step (kept off here)
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      # LTP-A-025: SHA-pin every new Action by commit SHA, not tag.
      - name: Run Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a  # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496  # codeql-bundle-v2.25.6
        with:
          sarif_file: results.sarif
