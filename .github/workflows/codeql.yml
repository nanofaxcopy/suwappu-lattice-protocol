# CodeQL static analysis (SAST).
#
# Closes the gap where the Security tab only received OpenSSF Scorecard
# SARIF: this runs real dataflow analysis over the Python SDK and the
# workflow files themselves. Solidity is not a CodeQL language; the
# contracts are covered by Slither + Echidna (see contracts.yml and
# `make contracts-secaudit`).
#
# All actions SHA-pinned per audit finding LTP-A-025.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, offset from scorecard.yml (Mon 06:27) to avoid runner contention.
    - cron: "43 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c35d1b164463ee62a100735382aaaa525c5d3496  # codeql-bundle-v2.25.6
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@c35d1b164463ee62a100735382aaaa525c5d3496  # codeql-bundle-v2.25.6
        with:
          category: "/language:${{ matrix.language }}"
