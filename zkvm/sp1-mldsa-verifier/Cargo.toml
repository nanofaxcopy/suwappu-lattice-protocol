[package]
name = "sp1-mldsa-verifier"
version = "0.1.0"
edition = "2021"
description = "SP1 zkVM circuit: proves ML-DSA-65 signature validity for ETP bridge"

[dependencies]
# "embedded" allocator (free-list, reclaims memory) instead of the default
# "bump" allocator (never frees) -- ML-DSA-65 verification's NTT/matrix-
# expansion working set exceeds sp1-zkvm's 0x78000000 (1.875GB) MAX_MEMORY
# under bump allocation; embedded's reuse keeps peak usage within budget.
sp1-zkvm = { version = "4.0", default-features = false, features = ["lib", "libm", "embedded"] }
sha3 = "0.10"
# Pure-Rust ML-DSA-65 (FIPS 204) — compatible with SP1's RISC-V target
ml-dsa = "0.1.0-rc.8"
