[package]
name = "sp1-host"
version = "0.1.0"
edition = "2021"
description = "SP1 host binary: generates and verifies ZK proofs for ETP bridge"

[[bin]]
name = "sp1-host"
path = "src/main.rs"

[[bin]]
name = "sp1-verify"
path = "src/verify.rs"

[dependencies]
sp1-sdk = "6.0"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
tokio = { version = "1", features = ["full"] }
