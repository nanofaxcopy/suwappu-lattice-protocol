[package]
name = "risc0-host"
version = "0.1.0"
edition = "2021"
description = "RISC Zero host binary: generates and verifies ZK proofs for ETP bridge"

[[bin]]
name = "risc0-host"
path = "src/main.rs"

[[bin]]
name = "risc0-verify"
path = "src/verify.rs"

[dependencies]
risc0-zkvm = "5.0.0-rc.1"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
tokio = { version = "1", features = ["full"] }

# NOTE: Requires the RISC Zero toolchain (rzup) and compiled guest ELF.
# The guest must be built first: cd ../risc0-mldsa-verifier && cargo risczero build
