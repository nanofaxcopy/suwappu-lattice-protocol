[package]
name = "risc0-mldsa-verifier"
version = "0.1.0"
edition = "2021"
description = "RISC Zero zkVM guest: proves ML-DSA-65 signature validity for ETP bridge"

[dependencies]
risc0-zkvm = { version = "5.0", default-features = false, features = ["guest"] }
sha3 = "0.10"
ml-dsa = "0.1.0-rc.8"

# NOTE: This crate requires the RISC Zero toolchain (rzup) to compile.
# Install: curl -L https://risczero.com/install | bash && rzup
# Build: cargo risczero build
